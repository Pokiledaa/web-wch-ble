<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06080a">
<title>Claude Doom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: a phone shooter's screen, held in landscape. The whole screen is the play surface.
     Readouts sit in a thin strip along the top. The left part is the move zone: the stick
     appears wherever the thumb lands. Everywhere else drags the view round. FIRE sits under
     the right thumb. Connect, Start and the settings live in a menu that covers the screen
     until a game is running.
     Look: the board's display is a 1-bit OLED, so this is drawn the same way: black, one
     cold white, dither dots for shading, a pixel face for the readouts. Red is kept for
     FIRE and for being hurt. */
  :root {
    --black: #06080a;
    --glass: #0e1318;
    --white: #dce8ff;   /* the cold white of an OLED pixel */
    --dim: #6c7a8e;
    --line: #27313d;
    --red: #ff3b30;
    --pixel: "Silkscreen", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background-color: var(--black);
    /* dither dots, the way the board shades its walls */
    background-image: radial-gradient(circle, #131a22 1px, transparent 1.2px);
    background-size: 6px 6px;
    color: var(--white);
    font: 15px/1.4 var(--sans);
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

  /* ---- readouts ---- */
  .hud {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    display: flex;
    align-items: flex-start;
    gap: 18px;
    pointer-events: none; /* drags pass straight through to the look area */
    font-family: var(--pixel);
  }
  .stat span { display: block; color: var(--dim); font-size: .62rem; letter-spacing: .12em; }
  .stat strong { display: block; font-size: 1.5rem; font-weight: 700; line-height: 1.05; }
  #health.low { color: var(--red); }
  #menuBtn {
    pointer-events: auto;
    margin-left: auto;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--glass);
    font: 400 .7rem var(--pixel);
    letter-spacing: .12em;
  }

  /* ---- move zone and stick ---- */
  #moveZone {
    position: absolute;
    left: 0;
    top: 64px;
    bottom: 0;
    width: 44%;
    touch-action: none;
  }
  #stick {
    --size: min(34vh, 132px);
    position: absolute;
    width: var(--size);
    height: var(--size);
    margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
    border: 2px dashed var(--line);
    border-radius: 50%;
    pointer-events: none;
  }
  #stick.held { border-style: solid; border-color: var(--dim); }
  #knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 42%;
    height: 42%;
    margin: -21% 0 0 -21%;
    border-radius: 50%;
    border: 2px solid var(--dim);
    background: var(--glass);
  }
  #stick.held #knob { border-color: var(--white); background: var(--white); }
  .tag {
    position: absolute;
    color: var(--dim);
    font: 400 .62rem var(--pixel);
    letter-spacing: .14em;
    pointer-events: none;
  }
  #moveTag { left: 50%; top: 100%; transform: translate(-50%, 8px); white-space: nowrap; }
  #lookTag { left: 50%; top: 52%; transform: translate(-50%, -50%); }
  body.playing #lookTag, #stick.held #moveTag { opacity: 0; }

  /* ---- fire ---- */
  #fire {
    position: absolute;
    right: max(26px, calc(env(safe-area-inset-right) + 14px));
    bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px));
    width: calc(min(30vh, 112px) * var(--fire-scale, 1)); /* the player can resize and move it */
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid var(--red);
    background: rgba(255, 59, 48, .1);
    color: var(--red);
    font: 700 .85rem var(--pixel);
    letter-spacing: .14em;
    touch-action: none;
  }
  #fire.firing { background: var(--red); color: var(--black); }
  #fire.knife { border-color: var(--white); background: rgba(220, 232, 255, .1); color: var(--white); }
  #fire.knife.firing { background: var(--white); color: var(--black); }
  #fire:disabled { opacity: .35; }
  body.arranging #fire { border-style: dashed; background: rgba(255, 59, 48, .25); }

  /* ---- aim: tap to bring the sights up, tap again to lower them ---- */
  #aim {
    position: absolute;
    right: max(26px, calc(env(safe-area-inset-right) + 14px));
    top: max(64px, calc(env(safe-area-inset-top) + 56px));
    width: min(20vh, 72px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid var(--white);
    background: rgba(220, 232, 255, .08);
    font: 700 .7rem var(--pixel);
    letter-spacing: .12em;
    touch-action: none;
  }
  #aim.on { background: var(--white); color: var(--black); }
  #aim:disabled { opacity: .35; }

  /* ---- moving the FIRE button ---- */
  #arrange {
    position: absolute;
    top: max(8px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px 8px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--glass);
    white-space: nowrap;
    font-size: .85rem;
  }
  #arrange[hidden] { display: none; }
  #arrange .btn { flex: none; padding: 8px 12px; }
  body.arranging .hud { visibility: hidden; }

  /* ---- being hurt: the edges of the screen flash red ---- */
  #hurt {
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 70px 24px var(--red);
    opacity: 0;
  }
  #hurt.hit { animation: hurt .45s ease-out; }
  @keyframes hurt { from { opacity: .9; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #hurt.hit { animation-duration: .01s; }
  }

  /* ---- menu ---- */
  #menu {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: rgba(6, 8, 10, .86);
    overflow-y: auto;
    touch-action: pan-y;
  }
  #menu[hidden] { display: none; }
  .panel {
    width: min(100%, 430px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--glass);
  }
  h1 { margin: 0; font: 700 1.5rem var(--pixel); letter-spacing: .04em; }
  #status { margin: 0; color: var(--dim); min-height: 1.4em; }
  #status.bad { color: var(--red); }
  .row { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    padding: 11px 10px;
    border: 1px solid var(--white);
    border-radius: 4px;
    background: var(--white);
    color: var(--black);
    font: 700 .8rem var(--pixel);
    letter-spacing: .08em;
  }
  .btn.quiet { background: transparent; color: var(--white); border-color: var(--line); }
  .btn:disabled { opacity: .35; }
  .btn[hidden] { display: none; }
  .tune { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: .85rem; }
  .tune input { flex: 1; min-width: 0; accent-color: var(--white); touch-action: pan-x; }
  .tune input[type=checkbox] { flex: none; width: 20px; height: 20px; margin: 0; }
  .tune output { min-width: 2ch; color: var(--white); font: 700 1rem var(--pixel); text-align: right; }
  .help { margin: 0; color: var(--dim); font-size: .8rem; }
  .links { display: flex; flex-wrap: wrap; gap: 2px 14px; }
  a { color: var(--dim); font-size: .8rem; }
  @media (max-height: 380px) {
    .help { display: none; } /* a phone on its side has little height to spare */
    .panel { gap: 9px; padding: 12px 16px; }
  }
</style>
</head>
<body>
  <div id="moveZone">
    <div id="stick"><div id="knob"></div><span class="tag" id="moveTag">MOVE</span></div>
  </div>
  <span class="tag" id="lookTag">DRAG TO LOOK</span>

  <div class="hud">
    <div class="stat"><span>HEALTH</span><strong id="health">0</strong></div>
    <div class="stat"><span>AMMO</span><strong id="ammo">0</strong></div>
    <div class="stat"><span>KILLS</span><strong id="kills">0</strong></div>
    <div class="stat"><span>LEVEL</span><strong id="level">-</strong></div>
    <button id="menuBtn" type="button" aria-controls="menu">MENU</button>
  </div>

  <button id="aim" type="button" aria-pressed="false" disabled>AIM</button>
  <button id="fire" type="button" disabled>FIRE</button>
  <div id="hurt"></div>

  <div id="arrange" hidden>
    <span>Drag FIRE to where you want it</span>
    <button id="resetFire" class="btn quiet" type="button">RESET</button>
    <button id="doneFire" class="btn" type="button">DONE</button>
  </div>

  <div id="menu">
    <div class="panel">
      <h1 id="title">CLAUDE DOOM</h1>
      <p id="status" role="status" aria-live="polite">Not connected</p>
      <div class="row">
        <button id="connect" class="btn" type="button">CONNECT</button>
        <button id="start" class="btn" type="button" disabled>START</button>
        <button id="exit" class="btn quiet" type="button" disabled>CLOCK</button>
      </div>
      <label class="tune">Turn speed
        <input id="turnSpeed" type="range" min="1" max="20" step="1" value="5">
        <output id="turnSpeedValue" for="turnSpeed">5</output>
      </label>
      <label class="tune">FIRE size
        <input id="fireSize" type="range" min="60" max="180" step="10" value="100">
        <button id="moveFire" class="btn quiet" type="button" style="flex: none">MOVE FIRE</button>
      </label>
      <label class="tune">
        <input id="vibration" type="checkbox" checked>
        <span id="vibrationLabel">Vibrate when hit</span>
      </label>
      <p class="help">Left thumb anywhere on the left moves. Drag anywhere else to look. Hold FIRE to shoot, and slide it to turn. Tap AIM to zoom in.</p>
      <button id="resume" class="btn quiet" type="button" hidden>BACK TO THE GAME</button>
      <div class="links">
        <a href="../">LED and clock</a>
        <a href="../snake/">Snake</a>
        <a href="../maze/">Tilt Maze</a>
        <a href="../racing/">Race</a>
        <a href="../shooter/">Shooter</a>
      </div>
    </div>
  </div>

<script>
  const SERVICE = 0xFFE0;
  const CMD_CHAR = 0xFFE2;   // {command, strafe, forward, turn steps, buttons}: 5 start, 7 input, 0 back to the clock
  const STATE_CHAR = 0xFFE4; // notification {state, health, ammo, kills, level}
  const TIME_CHAR = 0xFFE5;  // {hour, minute, second}
  const CMD_EXIT = 0, CMD_START = 5, CMD_INPUT = 7;
  const BUTTON_FIRE = 1, BUTTON_AIM = 2;
  const DEAD_ZONE = 0.12;       // fraction of the stick's travel that counts as centred
  const LOOK_DEG_PER_PX_PER_SPEED = 0.025; // at turn speed 5 a finger turns the view 0.125 degrees per pixel
  const DEFAULT_TURN_SPEED = 5;            // the slider runs from 1 to 20
  const TURN_STEP_DEG = 360 / 512; // the board turns in steps of 1/512 of a turn (one screen column)
  const KEY_TURN_DEG_PER_S = 150;
  const SEND_INTERVAL_MS = 30;

  const $ = (id) => document.getElementById(id);
  const statusEl = $('status'), titleEl = $('title'), menuEl = $('menu');
  const connectBtn = $('connect'), startBtn = $('start'), exitBtn = $('exit');
  const menuBtn = $('menuBtn'), resumeBtn = $('resume');
  const healthEl = $('health'), ammoEl = $('ammo'), killsEl = $('kills'), levelEl = $('level');
  const moveZone = $('moveZone'), stickEl = $('stick'), knobEl = $('knob');
  const fireBtn = $('fire'), aimBtn = $('aim'), hurtEl = $('hurt');
  const turnSpeedEl = $('turnSpeed'), turnSpeedValueEl = $('turnSpeedValue');
  const fireSizeEl = $('fireSize'), moveFireBtn = $('moveFire'), arrangeEl = $('arrange');

  let device = null;
  let cmdChar = null;
  let playing = false;
  let lastHealth = 0;
  let sending = false;
  let wakeLock = null;
  let arranging = false;  // the player is dragging the FIRE button to a new place

  // Everything that feeds the controls: the move stick, dragging on the screen, FIRE and the keyboard
  const move = { x: 0, y: 0 };
  let lookSteps = 0;      // turning not sent to the board yet, in steps (fractions are kept)
  let lastSendTime = performance.now();
  let firing = false;
  let aiming = false;     // looking down the sights: the board zooms the view
  const keys = new Set();

  let gattQueue = Promise.resolve();
  function gatt(op) {
    const run = gattQueue.then(op, op);
    gattQueue = run.catch(() => {});
    return run;
  }

  function setStatus(text, bad) {
    statusEl.textContent = text;
    statusEl.classList.toggle('bad', !!bad);
  }

  // The menu covers the controls. It is up whenever there is no game to play.
  function showMenu(open) {
    menuEl.hidden = !open;
    resumeBtn.hidden = !playing;
  }

  function showGame(state, health, ammo, kills, level) {
    const wasPlaying = playing;
    if (wasPlaying && health < lastHealth) {
      // A harder hit buzzes longer (imps take 3 to 24 health); dying is a long double buzz
      buzz(state === 2 ? [500, 80, 700] : Math.min(600, 220 + (lastHealth - health) * 15));
      hurtEl.classList.remove('hit');
      void hurtEl.offsetWidth; // restart the flash if one is still fading
      hurtEl.classList.add('hit');
    }
    lastHealth = health;
    playing = state === 1;
    document.body.classList.toggle('playing', playing);
    healthEl.textContent = health;
    healthEl.classList.toggle('low', playing && health <= 25);
    // FIRE stabs when the bullets run out, and both the readout and the button say so
    const knife = playing && ammo === 0;
    ammoEl.textContent = knife ? 'KNIFE' : ammo;
    fireBtn.textContent = knife ? 'STAB' : 'FIRE';
    fireBtn.classList.toggle('knife', knife);
    aimBtn.disabled = !playing || knife; // the sights belong to the pistol
    if (aimBtn.disabled) setAiming(false);
    killsEl.textContent = kills;
    levelEl.textContent = level || '-';
    titleEl.textContent = state === 2 ? 'YOU DIED' : state === 3 ? 'YOU WIN' : 'CLAUDE DOOM';
    startBtn.textContent = state >= 2 ? 'AGAIN' : state === 1 ? 'RESTART' : 'START';
    if (state >= 2) setStatus(kills + (kills === 1 ? ' kill' : ' kills') + ', reached level ' + level + '.');
    if (playing !== wasPlaying) showMenu(!playing); // a game starting clears the screen; one ending brings the menu back
  }

  function showConnected(connected) {
    startBtn.disabled = !connected;
    exitBtn.disabled = !connected;
    fireBtn.disabled = !connected && !arranging;
    connectBtn.textContent = connected ? 'DISCONNECT' : 'CONNECT';
    connectBtn.classList.toggle('quiet', connected);
    if (!connected) { showGame(0, 0, 0, 0, 0); showMenu(true); }
  }

  function onDisconnected() {
    cmdChar = null;
    showConnected(false);
    setStatus('Disconnected');
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  // -1..1 with a dead zone in the middle
  function shape(v) {
    const mag = Math.abs(v);
    if (mag < DEAD_ZONE) return 0;
    return Math.sign(v) * Math.min(1, (mag - DEAD_ZONE) / (1 - DEAD_ZONE));
  }

  const key = (plus, minus) => (keys.has(plus) ? 1 : 0) - (keys.has(minus) ? 1 : 0);
  const clamp = (v) => Math.max(-127, Math.min(127, Math.round(v)));

  // Vibration can be switched off, and switching it on buzzes once so the player can tell
  // whether this phone and browser will do it at all
  const vibrationEl = $('vibration');
  function buzz(pattern) {
    if (vibrationEl.checked && navigator.vibrate) navigator.vibrate(pattern);
  }
  if (!navigator.vibrate) {
    vibrationEl.checked = false;
    vibrationEl.disabled = true;
    $('vibrationLabel').textContent = 'This browser cannot vibrate the phone';
  } else {
    try { vibrationEl.checked = localStorage.getItem('doomVibration') !== '0'; } catch (err) { /* on by default */ }
    vibrationEl.addEventListener('change', () => {
      try { localStorage.setItem('doomVibration', vibrationEl.checked ? '1' : '0'); } catch (err) { /* not remembered */ }
      buzz(300);
    });
  }

  // Turn speed is the player's own setting, kept on this phone between visits
  let lookDegPerPx = 0;
  function setTurnSpeed(value, save) {
    const speed = Math.max(1, Math.min(20, Math.round(Number(value)) || DEFAULT_TURN_SPEED));
    turnSpeedEl.value = speed;
    turnSpeedValueEl.textContent = speed;
    lookDegPerPx = speed * LOOK_DEG_PER_PX_PER_SPEED;
    if (save) {
      try { localStorage.setItem('doomTurnSpeed', speed); } catch (err) { /* private mode: not remembered */ }
    }
  }
  let savedTurnSpeed = null;
  try { savedTurnSpeed = localStorage.getItem('doomTurnSpeed'); } catch (err) { /* use the default */ }
  setTurnSpeed(savedTurnSpeed, false);
  turnSpeedEl.addEventListener('input', () => setTurnSpeed(turnSpeedEl.value, true));

  // Turning is sent as an amount, so the view follows the finger exactly however fast it moves
  function addLook(degrees) {
    if (playing) lookSteps += degrees / TURN_STEP_DEG;
  }

  async function sendInput() {
    const now = performance.now();
    addLook(key('ArrowRight', 'ArrowLeft') * KEY_TURN_DEG_PER_S * (now - lastSendTime) / 1000);
    lastSendTime = now;
    if (!playing) lookSteps = 0;
    if (!cmdChar || !playing || sending) return;
    sending = true;
    const target = cmdChar;
    const turn = Math.max(-127, Math.min(127, Math.trunc(lookSteps)));
    lookSteps -= turn; // what does not fit in this packet goes in the next
    try {
      await gatt(() => target.writeValueWithoutResponse(Int8Array.of(
        CMD_INPUT,
        clamp((shape(move.x) + key('d', 'a')) * 127),
        clamp((-shape(move.y) + key('w', 's')) * 127),
        turn,
        ((firing || keys.has(' ')) ? BUTTON_FIRE : 0) | ((aiming || keys.has('Shift')) ? BUTTON_AIM : 0))));
    } catch (err) {
      lookSteps += turn; // not sent: keep the turn for the next packet
    } finally {
      sending = false;
    }
  }
  setInterval(sendInput, SEND_INTERVAL_MS);

  async function command(cmd) {
    if (!cmdChar) return;
    const target = cmdChar;
    try {
      await gatt(() => target.writeValueWithResponse(Int8Array.of(cmd, 0, 0, 0, 0)));
    } catch (err) {
      setStatus('Send failed. Is the board running the Doom firmware? (' + err.message + ')', true);
    }
  }

  function start() {
    // Neither of these may hold the game up: both can be refused, or never answer at all.
    if (navigator.wakeLock && !wakeLock) {
      navigator.wakeLock.request('screen').then((lock) => { wakeLock = lock; }).catch(() => {});
    }
    // A game wants the whole screen, sideways. This has to be asked for straight from the tap.
    if (!document.fullscreenElement && document.documentElement.requestFullscreen &&
        matchMedia('(pointer: coarse)').matches) {
      document.documentElement.requestFullscreen()
        .then(() => screen.orientation.lock('landscape'))
        .catch(() => {});
    }
    return command(CMD_START);
  }

  async function connect() {
    if (!navigator.bluetooth) {
      setStatus(window.isSecureContext
        ? 'This browser has no Web Bluetooth. Use Chrome on Android.'
        : 'Web Bluetooth needs HTTPS. Open this page over https://.', true);
      return;
    }
    connectBtn.disabled = true;
    try {
      setStatus('Choose the board in the list…');
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'Claude' }, { namePrefix: 'CH582' }], // the old name, for phones that remember it
        optionalServices: [SERVICE]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);

      setStatus('Connecting…');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE);
      cmdChar = await service.getCharacteristic(CMD_CHAR);
      if (!cmdChar.properties.write) {
        throw new Error('this board is not running the Doom firmware');
      }

      const stateChar = await service.getCharacteristic(STATE_CHAR);
      stateChar.addEventListener('characteristicvaluechanged', (event) => {
        const v = event.target.value;
        if (v.byteLength >= 5) showGame(v.getUint8(0), v.getUint8(1), v.getUint8(2), v.getUint8(3), v.getUint8(4));
      });
      await gatt(() => stateChar.startNotifications());

      try {
        const timeChar = await service.getCharacteristic(TIME_CHAR);
        const now = new Date();
        await gatt(() => timeChar.writeValueWithResponse(
          Uint8Array.of(now.getHours(), now.getMinutes(), now.getSeconds())));
      } catch (err) { /* the clock is optional */ }

      showConnected(true);
      setStatus('Connected. Turn the phone sideways and press Start.');
    } catch (err) {
      if (device && device.gatt.connected) device.gatt.disconnect();
      cmdChar = null;
      showConnected(false);
      setStatus(err.name === 'NotFoundError' ? 'No board chosen' : 'Could not connect: ' + err.message,
        err.name !== 'NotFoundError');
    } finally {
      connectBtn.disabled = false;
    }
  }

  connectBtn.addEventListener('click', () => {
    if (device && device.gatt.connected) device.gatt.disconnect();
    else connect();
  });
  startBtn.addEventListener('click', start);
  exitBtn.addEventListener('click', () => command(CMD_EXIT));
  menuBtn.addEventListener('click', () => showMenu(menuEl.hidden));
  resumeBtn.addEventListener('click', () => showMenu(false));

  // Move stick: it appears under the thumb, wherever in the move zone that lands, and follows
  // that finger until it lifts. At rest it waits, dashed, in the bottom corner.
  let movePointer = null, stickX = 0, stickY = 0;
  function placeStick(x, y, held) {
    const zone = moveZone.getBoundingClientRect();
    const half = stickEl.offsetWidth / 2;
    stickX = Math.max(zone.left + half, Math.min(zone.right - half, x));
    stickY = Math.max(zone.top + half, Math.min(zone.bottom - half, y));
    stickEl.style.left = (stickX - zone.left) + 'px';
    stickEl.style.top = (stickY - zone.top) + 'px';
    stickEl.classList.toggle('held', held);
  }
  function setMove(x, y) {
    move.x = x;
    move.y = y;
    knobEl.style.transform = 'translate(' + (x * 70) + '%, ' + (y * 70) + '%)';
  }
  function restStick() {
    const zone = moveZone.getBoundingClientRect();
    placeStick(zone.left + zone.width * 0.42, zone.bottom - zone.height * 0.42, false);
    setMove(0, 0);
  }
  function trackStick(event) {
    const reach = stickEl.offsetWidth * 0.3; // how far the knob travels from the centre
    let x = (event.clientX - stickX) / reach, y = (event.clientY - stickY) / reach;
    const mag = Math.hypot(x, y);
    if (mag > 1) { x /= mag; y /= mag; }
    setMove(x, y);
  }
  moveZone.addEventListener('pointerdown', (event) => {
    if (movePointer !== null) return;
    event.preventDefault();
    movePointer = event.pointerId;
    moveZone.setPointerCapture(movePointer);
    placeStick(event.clientX, event.clientY, true);
    setMove(0, 0);
  });
  moveZone.addEventListener('pointermove', (event) => {
    if (event.pointerId === movePointer) trackStick(event);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) => {
    moveZone.addEventListener(type, (event) => {
      if (event.pointerId === movePointer) { movePointer = null; restStick(); }
    });
  });
  moveZone.addEventListener('contextmenu', (event) => event.preventDefault());
  restStick();
  window.addEventListener('resize', () => { if (movePointer === null) restStick(); });

  // Look: any finger dragged across the rest of the screen turns the view. Several can at once.
  const lookPointers = new Map(); // pointer id -> last x position
  document.addEventListener('pointerdown', (event) => {
    if (event.target.closest('#moveZone, #menu, #arrange, button, a')) return;
    lookPointers.set(event.pointerId, event.clientX);
  });
  document.addEventListener('pointermove', (event) => {
    const last = lookPointers.get(event.pointerId);
    if (last === undefined) return;
    addLook((event.clientX - last) * lookDegPerPx);
    lookPointers.set(event.pointerId, event.clientX);
  });
  ['pointerup', 'pointercancel'].forEach((type) => {
    document.addEventListener(type, (event) => lookPointers.delete(event.pointerId));
  });

  // FIRE shoots while held, and sliding the same thumb turns just like a drag anywhere else,
  // so you can aim and shoot together. Fire state goes out straight away, not on the next tick.
  let firePointer = null, fireLastX = 0;
  function setFiring(on) {
    if (firing === on) return;
    firing = on;
    fireBtn.classList.toggle('firing', on);
    sendInput();
  }
  fireBtn.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    firePointer = event.pointerId;
    fireLastX = event.clientX;
    fireBtn.setPointerCapture(firePointer);
    if (!arranging) setFiring(true);
  });
  fireBtn.addEventListener('pointermove', (event) => {
    if (event.pointerId !== firePointer) return;
    if (arranging) {
      // the button's centre follows the finger; kept as fractions so it survives rotation
      fireLayout.x = event.clientX / window.innerWidth;
      fireLayout.y = event.clientY / window.innerHeight;
      applyFireLayout();
      return;
    }
    addLook((event.clientX - fireLastX) * lookDegPerPx);
    fireLastX = event.clientX;
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) => {
    fireBtn.addEventListener(type, (event) => {
      if (event.pointerId !== firePointer) return;
      firePointer = null;
      setFiring(false);
      if (arranging) saveFireLayout();
    });
  });
  fireBtn.addEventListener('contextmenu', (event) => event.preventDefault());

  // AIM is a switch, not a hold: the right thumb is busy looking and firing
  function setAiming(on) {
    aiming = on;
    aimBtn.classList.toggle('on', on);
    aimBtn.setAttribute('aria-pressed', on);
  }
  aimBtn.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    setAiming(!aiming);
    sendInput();
  });
  aimBtn.addEventListener('contextmenu', (event) => event.preventDefault());

  // The FIRE button's place and size are the player's own, kept on this phone between visits.
  // x and y are the centre as fractions of the screen; null means the usual bottom right corner.
  const fireLayout = { x: null, y: null, size: 100 };
  try {
    const saved = JSON.parse(localStorage.getItem('doomFireLayout') || '{}');
    if (typeof saved.x === 'number' && typeof saved.y === 'number') { fireLayout.x = saved.x; fireLayout.y = saved.y; }
    if (saved.size >= 60 && saved.size <= 180) fireLayout.size = saved.size;
  } catch (err) { /* use the defaults */ }
  function saveFireLayout() {
    try { localStorage.setItem('doomFireLayout', JSON.stringify(fireLayout)); } catch (err) { /* not remembered */ }
  }
  function applyFireLayout() {
    fireBtn.style.setProperty('--fire-scale', fireLayout.size / 100);
    fireSizeEl.value = fireLayout.size;
    if (fireLayout.x === null) {
      fireBtn.style.left = fireBtn.style.top = fireBtn.style.right = fireBtn.style.bottom = '';
      return;
    }
    const half = fireBtn.offsetWidth / 2; // kept wholly on the screen
    const cx = Math.max(half, Math.min(window.innerWidth - half, fireLayout.x * window.innerWidth));
    const cy = Math.max(half, Math.min(window.innerHeight - half, fireLayout.y * window.innerHeight));
    fireBtn.style.left = (cx - half) + 'px';
    fireBtn.style.top = (cy - half) + 'px';
    fireBtn.style.right = fireBtn.style.bottom = 'auto';
  }
  function setArranging(on) {
    arranging = on;
    document.body.classList.toggle('arranging', on);
    arrangeEl.hidden = !on;
    fireBtn.disabled = !cmdChar && !on; // it has to take touches to be dragged
    showMenu(!on && !playing);
  }
  applyFireLayout();
  window.addEventListener('resize', applyFireLayout);
  fireSizeEl.addEventListener('input', () => {
    fireLayout.size = Number(fireSizeEl.value);
    applyFireLayout();
    saveFireLayout();
  });
  moveFireBtn.addEventListener('click', () => setArranging(true));
  $('doneFire').addEventListener('click', () => setArranging(false));
  $('resetFire').addEventListener('click', () => {
    fireLayout.x = fireLayout.y = null;
    fireLayout.size = 100;
    applyFireLayout();
    saveFireLayout();
  });

  // Keyboard, for trying it from a laptop: W A S D to move, left and right arrows (or dragging the mouse) to turn, space to fire, hold Shift to aim
  const GAME_KEYS = ['w', 'a', 's', 'd', 'ArrowLeft', 'ArrowRight', ' ', 'Shift'];
  const keyName = (event) => (event.key.length === 1 ? event.key.toLowerCase() : event.key);
  window.addEventListener('keydown', (event) => {
    const k = keyName(event);
    if (!GAME_KEYS.includes(k)) return;
    if (k === ' ' && event.target.tagName === 'BUTTON') return; // space presses the focused button
    if (event.target.tagName === 'INPUT') return;               // arrows move the turn speed slider
    event.preventDefault();
    keys.add(k);
  });
  window.addEventListener('keyup', (event) => keys.delete(keyName(event)));
  window.addEventListener('blur', () => keys.clear());

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  }
</script>
</body>
</html>
