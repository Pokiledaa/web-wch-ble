<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10161c">
<title>CH582 Doom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* Layout: a phone shooter. Status and buttons along the top; below them the whole screen is
     the look area (drag anywhere to turn), with the move stick under the left thumb and FIRE
     under the right. Meant to be held in landscape. */
  :root {
    --bg: #eef1f3;
    --panel: #ffffff;
    --fg: #17202a;
    --muted: #5d6b78;
    --line: #cfd6dc;
    --accent: #0b6e8f;
    --go: #1f8a4c;
    --bad: #b3261e;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161c;
      --panel: #19222b;
      --fg: #e6edf2;
      --muted: #93a2b0;
      --line: #2c3945;
      --accent: #5cc3e6;
      --go: #5fd08a;
      --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.4 var(--sans);
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
    padding-block: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-bottom));
    overscroll-behavior: none;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: -.01em; }
  #status { margin: 0; color: var(--muted); font-size: .9rem; flex: 1 1 140px; min-width: 0; }
  #status.bad { color: var(--bad); }
  .buttons { display: flex; gap: 8px; }
  .btn {
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--bg);
    font: 600 .95rem var(--sans);
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn.go { background: var(--go); border-color: var(--go); }
  .btn.quiet { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .45; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
  }
  .stats div { padding: 6px 10px; text-align: center; }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats span { display: block; color: var(--muted); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; }
  .stats strong { font: 650 1.35rem var(--mono); font-variant-numeric: tabular-nums; }
  #health.low { color: var(--bad); }

  .pad { flex: 1; min-height: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .side p { margin: 0; color: var(--muted); font-size: .8rem; }

  .stick {
    --size: min(40vw, 58vh, 210px);
    position: relative;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--panel);
    touch-action: none;
    cursor: pointer;
  }
  .stick::before, .stick::after { content: ""; position: absolute; background: var(--line); }
  .stick::before { left: 50%; top: 14%; bottom: 14%; width: 1px; }
  .stick::after { top: 50%; left: 14%; right: 14%; height: 1px; }
  .knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 36%;
    height: 36%;
    margin: -18% 0 0 -18%;
    border-radius: 50%;
    background: var(--accent);
    z-index: 1;
    pointer-events: none;
  }
  .stick.off { opacity: .45; }

  #fire {
    width: min(30vw, 42vh, 150px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid var(--bad);
    background: transparent;
    color: var(--bad);
    font: 700 1.1rem var(--sans);
    letter-spacing: .1em;
    touch-action: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #fire.firing { background: var(--bad); color: var(--bg); }
  #fire:disabled { opacity: .45; }
  .hint { align-self: center; margin: 0; color: var(--muted); font-size: .9rem; text-align: center; }

  footer { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; }
  a { color: var(--accent); font-size: .85rem; }
  @media (max-height: 420px) {
    footer { display: none; } /* no room in landscape on a phone */
  }
</style>
</head>
<body>
  <header>
    <h1>CH582 Doom</h1>
    <p id="status" role="status" aria-live="polite">Not connected</p>
    <div class="buttons">
      <button id="start" class="btn go" type="button" disabled>Start</button>
      <button id="exit" class="btn quiet" type="button" disabled>Clock</button>
      <button id="connect" class="btn" type="button">Connect</button>
    </div>
  </header>

  <div class="stats">
    <div><span>Health</span><strong id="health">0</strong></div>
    <div><span>Ammo</span><strong id="ammo">0</strong></div>
    <div><span>Kills</span><strong id="kills">0</strong></div>
    <div><span id="gameState">Idle</span><strong id="level">-</strong></div>
  </div>

  <div class="pad">
    <div class="side">
      <div class="stick off" id="move" aria-label="Move stick"><div class="knob"></div></div>
      <p>Move</p>
    </div>
    <p class="hint">Drag anywhere to turn</p>
    <div class="side">
      <button id="fire" type="button" disabled>FIRE</button>
      <p>Hold to shoot, slide to aim</p>
    </div>
  </div>

  <footer>
    <a href="../">LED and brightness controls</a>
    <a href="../snake/">Play Snake</a>
    <a href="../maze/">Play Tilt Maze</a>
    <a href="../racing/">Play Race</a>
    <a href="../shooter/">Play Shooter</a>
  </footer>

<script>
  const SERVICE = 0xFFE0;
  const CMD_CHAR = 0xFFE2;   // {command, strafe, forward, turn steps, buttons}: 5 start, 7 input, 0 back to the clock
  const STATE_CHAR = 0xFFE4; // notification {state, health, ammo, kills, level}
  const TIME_CHAR = 0xFFE5;  // {hour, minute, second}
  const CMD_EXIT = 0, CMD_START = 5, CMD_INPUT = 7;
  const BUTTON_FIRE = 1;
  const DEAD_ZONE = 0.12;       // fraction of the stick's travel that counts as centred
  const LOOK_DEG_PER_PX = 0.3;  // how far the view turns for each pixel a finger is dragged
  const TURN_STEP_DEG = 360 / 512; // the board turns in steps of 1/512 of a turn (one screen column)
  const KEY_TURN_DEG_PER_S = 150;
  const SEND_INTERVAL_MS = 30;

  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connect');
  const startBtn = document.getElementById('start');
  const exitBtn = document.getElementById('exit');
  const healthEl = document.getElementById('health');
  const ammoEl = document.getElementById('ammo');
  const killsEl = document.getElementById('kills');
  const levelEl = document.getElementById('level');
  const stateEl = document.getElementById('gameState');
  const moveEl = document.getElementById('move');
  const fireBtn = document.getElementById('fire');

  let device = null;
  let cmdChar = null;
  let playing = false;
  let lastHealth = 0;
  let sending = false;
  let wakeLock = null;

  // Everything that feeds the controls: the move stick, dragging on the screen, FIRE and the keyboard
  const move = { x: 0, y: 0 };
  let lookSteps = 0;      // turning not sent to the board yet, in steps (fractions are kept)
  let lastSendTime = performance.now();
  let firing = false;
  const keys = new Set();

  let gattQueue = Promise.resolve();
  function gatt(op) {
    const run = gattQueue.then(op, op);
    gattQueue = run.catch(() => {});
    return run;
  }

  function setStatus(text, bad) {
    statusEl.textContent = text;
    statusEl.classList.toggle('bad', !!bad);
  }

  function showGame(state, health, ammo, kills, level) {
    if (playing && health < lastHealth && navigator.vibrate) navigator.vibrate(state === 2 ? 400 : 80);
    lastHealth = health;
    playing = state === 1;
    healthEl.textContent = health;
    healthEl.classList.toggle('low', playing && health <= 25);
    ammoEl.textContent = ammo;
    killsEl.textContent = kills;
    levelEl.textContent = level || '-';
    stateEl.textContent = state === 1 ? 'Level' : state === 2 ? 'You died' : state === 3 ? 'You win' : 'Idle';
    startBtn.textContent = state >= 2 ? 'Again' : state === 1 ? 'Restart' : 'Start';
  }

  function showConnected(connected) {
    startBtn.disabled = !connected;
    exitBtn.disabled = !connected;
    fireBtn.disabled = !connected;
    moveEl.classList.toggle('off', !connected);
    connectBtn.textContent = connected ? 'Disconnect' : 'Connect';
    connectBtn.classList.toggle('quiet', connected);
    if (!connected) showGame(0, 0, 0, 0, 0);
  }

  function onDisconnected() {
    cmdChar = null;
    showConnected(false);
    setStatus('Disconnected');
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  // -1..1 with a dead zone in the middle; `curve` above 1 makes small movements finer
  function shape(v, curve) {
    const mag = Math.abs(v);
    if (mag < DEAD_ZONE) return 0;
    return Math.sign(v) * Math.pow(Math.min(1, (mag - DEAD_ZONE) / (1 - DEAD_ZONE)), curve);
  }

  const key = (plus, minus) => (keys.has(plus) ? 1 : 0) - (keys.has(minus) ? 1 : 0);
  const clamp = (v) => Math.max(-127, Math.min(127, Math.round(v)));

  // Turning is sent as an amount, so the view follows the finger exactly however fast it moves
  function addLook(degrees) {
    if (playing) lookSteps += degrees / TURN_STEP_DEG;
  }

  async function sendInput() {
    const now = performance.now();
    addLook(key('ArrowRight', 'ArrowLeft') * KEY_TURN_DEG_PER_S * (now - lastSendTime) / 1000);
    lastSendTime = now;
    if (!playing) lookSteps = 0;
    if (!cmdChar || !playing || sending) return;
    sending = true;
    const target = cmdChar;
    const turn = Math.max(-127, Math.min(127, Math.trunc(lookSteps)));
    lookSteps -= turn; // what does not fit in this packet goes in the next
    try {
      await gatt(() => target.writeValueWithoutResponse(Int8Array.of(
        CMD_INPUT,
        clamp((shape(move.x, 1) + key('d', 'a')) * 127),
        clamp((-shape(move.y, 1) + key('w', 's')) * 127),
        turn,
        (firing || keys.has(' ')) ? BUTTON_FIRE : 0)));
    } catch (err) {
      lookSteps += turn; // not sent: keep the turn for the next packet
    } finally {
      sending = false;
    }
  }
  setInterval(sendInput, SEND_INTERVAL_MS);

  async function command(cmd) {
    if (!cmdChar) return;
    const target = cmdChar;
    try {
      await gatt(() => target.writeValueWithResponse(Int8Array.of(cmd, 0, 0, 0, 0)));
    } catch (err) {
      setStatus('Send failed. Is the board running the Doom firmware? (' + err.message + ')', true);
    }
  }

  function start() {
    // Neither of these may hold the game up: both can be refused, or never answer at all.
    if (navigator.wakeLock && !wakeLock) {
      navigator.wakeLock.request('screen').then((lock) => { wakeLock = lock; }).catch(() => {});
    }
    // A gamepad wants the whole screen, sideways. This has to be asked for straight from the tap.
    if (!document.fullscreenElement && document.documentElement.requestFullscreen &&
        matchMedia('(pointer: coarse)').matches) {
      document.documentElement.requestFullscreen()
        .then(() => screen.orientation.lock('landscape'))
        .catch(() => {});
    }
    return command(CMD_START);
  }

  async function connect() {
    if (!navigator.bluetooth) {
      setStatus(window.isSecureContext
        ? 'This browser has no Web Bluetooth. Use Chrome on Android.'
        : 'Web Bluetooth needs HTTPS. Open this page over https://.', true);
      return;
    }
    connectBtn.disabled = true;
    try {
      setStatus('Choose the board in the list…');
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'CH582' }],
        optionalServices: [SERVICE]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);

      setStatus('Connecting…');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE);
      cmdChar = await service.getCharacteristic(CMD_CHAR);
      if (!cmdChar.properties.write) {
        throw new Error('this board is not running the Doom firmware');
      }

      const stateChar = await service.getCharacteristic(STATE_CHAR);
      stateChar.addEventListener('characteristicvaluechanged', (event) => {
        const v = event.target.value;
        if (v.byteLength >= 5) showGame(v.getUint8(0), v.getUint8(1), v.getUint8(2), v.getUint8(3), v.getUint8(4));
      });
      await gatt(() => stateChar.startNotifications());

      try {
        const timeChar = await service.getCharacteristic(TIME_CHAR);
        const now = new Date();
        await gatt(() => timeChar.writeValueWithResponse(
          Uint8Array.of(now.getHours(), now.getMinutes(), now.getSeconds())));
      } catch (err) { /* the clock is optional */ }

      showConnected(true);
      setStatus('Connected. Turn the phone sideways and press Start.');
    } catch (err) {
      if (device && device.gatt.connected) device.gatt.disconnect();
      cmdChar = null;
      showConnected(false);
      setStatus(err.name === 'NotFoundError' ? 'No board chosen' : 'Could not connect: ' + err.message,
        err.name !== 'NotFoundError');
    } finally {
      connectBtn.disabled = false;
    }
  }

  connectBtn.addEventListener('click', () => {
    if (device && device.gatt.connected) device.gatt.disconnect();
    else connect();
  });
  startBtn.addEventListener('click', start);
  exitBtn.addEventListener('click', () => command(CMD_EXIT));

  // A stick follows the finger that pressed it, even when that finger slides off the circle
  function makeStick(el, value, horizontalOnly) {
    const knob = el.querySelector('.knob');
    let pointer = null;

    function set(x, y) {
      value.x = x;
      value.y = y;
      knob.style.transform = 'translate(' + (x * 88) + '%, ' + (y * 88) + '%)';
    }
    function track(event) {
      const r = el.getBoundingClientRect();
      const reach = r.width * 0.32; // how far the knob can travel from the centre
      let x = (event.clientX - (r.left + r.width / 2)) / reach;
      let y = horizontalOnly ? 0 : (event.clientY - (r.top + r.height / 2)) / reach;
      const mag = Math.hypot(x, y);
      if (mag > 1) { x /= mag; y /= mag; }
      set(x, y);
    }
    el.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      pointer = event.pointerId;
      el.setPointerCapture(pointer);
      track(event);
    });
    el.addEventListener('pointermove', (event) => {
      if (event.pointerId === pointer) track(event);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) => {
      el.addEventListener(type, (event) => {
        if (event.pointerId === pointer) { pointer = null; set(0, 0); }
      });
    });
    el.addEventListener('contextmenu', (event) => event.preventDefault());
  }
  makeStick(moveEl, move, false);

  // Look: any finger dragged across the screen turns the view, wherever it lands, apart from
  // the move stick, the buttons and the links. Several fingers can do it at once.
  const lookPointers = new Map(); // pointer id -> last x position
  document.addEventListener('pointerdown', (event) => {
    if (event.target.closest('.stick, button, a')) return;
    lookPointers.set(event.pointerId, event.clientX);
  });
  document.addEventListener('pointermove', (event) => {
    const last = lookPointers.get(event.pointerId);
    if (last === undefined) return;
    addLook((event.clientX - last) * LOOK_DEG_PER_PX);
    lookPointers.set(event.pointerId, event.clientX);
  });
  ['pointerup', 'pointercancel'].forEach((type) => {
    document.addEventListener(type, (event) => lookPointers.delete(event.pointerId));
  });

  // FIRE shoots while held, and sliding the same thumb turns just like a drag anywhere else,
  // so you can aim and shoot together. Fire state goes out straight away, not on the next tick.
  let firePointer = null, fireLastX = 0;
  function setFiring(on) {
    if (firing === on) return;
    firing = on;
    fireBtn.classList.toggle('firing', on);
    sendInput();
  }
  fireBtn.addEventListener('pointerdown', (event) => {
    event.preventDefault();
    firePointer = event.pointerId;
    fireLastX = event.clientX;
    fireBtn.setPointerCapture(firePointer);
    setFiring(true);
  });
  fireBtn.addEventListener('pointermove', (event) => {
    if (event.pointerId !== firePointer) return;
    addLook((event.clientX - fireLastX) * LOOK_DEG_PER_PX);
    fireLastX = event.clientX;
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((type) => {
    fireBtn.addEventListener(type, (event) => {
      if (event.pointerId === firePointer) { firePointer = null; setFiring(false); }
    });
  });
  fireBtn.addEventListener('contextmenu', (event) => event.preventDefault());

  // Keyboard, for trying it from a laptop: W A S D to move, left and right arrows (or dragging the mouse) to turn, space to fire
  const GAME_KEYS = ['w', 'a', 's', 'd', 'ArrowLeft', 'ArrowRight', ' '];
  const keyName = (event) => (event.key.length === 1 ? event.key.toLowerCase() : event.key);
  window.addEventListener('keydown', (event) => {
    const k = keyName(event);
    if (!GAME_KEYS.includes(k)) return;
    if (k === ' ' && event.target.tagName === 'BUTTON') return; // space presses the focused button
    event.preventDefault();
    keys.add(k);
  });
  window.addEventListener('keyup', (event) => keys.delete(keyName(event)));
  window.addEventListener('blur', () => keys.clear());

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  }
</script>
</body>
</html>
