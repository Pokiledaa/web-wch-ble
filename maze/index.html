<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10161c">
<title>CH582 Maze</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* Layout: one centred column; level on top, a tilt indicator in the middle, connection at the bottom. */
  :root {
    --bg: #eef1f3;
    --panel: #ffffff;
    --fg: #17202a;
    --muted: #5d6b78;
    --line: #cfd6dc;
    --accent: #0b6e8f;
    --go: #1f8a4c;
    --bad: #b3261e;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161c;
      --panel: #19222b;
      --fg: #e6edf2;
      --muted: #93a2b0;
      --line: #2c3945;
      --accent: #5cc3e6;
      --go: #5fd08a;
      --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.45 var(--sans);
    display: flex;
    justify-content: center;
    padding-inline: 16px;
    padding-block: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-bottom));
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  main {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  header { text-align: center; display: flex; flex-direction: column; gap: 4px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 650; letter-spacing: -.01em; }
  #status { margin: 0; color: var(--muted); min-height: 1.45em; }
  #status.bad { color: var(--bad); }

  .score {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
  }
  .score span { color: var(--muted); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
  .score strong { font: 650 2rem var(--mono); font-variant-numeric: tabular-nums; }
  #gameState { font-size: .85rem; color: var(--muted); }

  .tilt {
    position: relative;
    width: min(62vw, 220px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--panel);
  }
  .tilt::before, .tilt::after {
    content: "";
    position: absolute;
    background: var(--line);
  }
  .tilt::before { left: 50%; top: 12%; bottom: 12%; width: 1px; }
  .tilt::after { top: 50%; left: 12%; right: 12%; height: 1px; }
  #dot {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
    border-radius: 50%;
    background: var(--go);
    z-index: 1;
  }
  #sensor { margin: 0; color: var(--muted); font-size: .9rem; text-align: center; min-height: 1.45em; }
  .btn.go { background: var(--go); border-color: var(--go); }

  .row { width: 100%; display: flex; gap: 10px; }
  .btn {
    flex: 1;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--bg);
    font: 600 1rem var(--sans);
    cursor: pointer;
  }
  .btn.quiet { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .45; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  a { color: var(--accent); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <header>
    <h1>CH582 Maze</h1>
    <p id="status" role="status" aria-live="polite">Not connected</p>
  </header>

  <div class="score">
    <div><span>Level</span><br><em id="gameState" style="font-style:normal">Idle</em></div>
    <strong id="level">0</strong>
  </div>

  <div class="tilt" aria-hidden="true"><div id="dot"></div></div>
  <p id="sensor">Tilt the phone to roll the ball</p>

  <div class="row">
    <button id="start" class="btn go" type="button" disabled>Start</button>
    <button id="exit" class="btn quiet" type="button" disabled>Show clock</button>
  </div>
  <div class="row">
    <button id="connect" class="btn" type="button">Connect</button>
  </div>

  <a href="../">LED and brightness controls</a>
  <a href="../snake/">Play Snake</a>
  <a href="../racing/">Play Race</a>
  <a href="../shooter/">Play Shooter</a>
  <a href="../doom/">Play Doom</a>
</main>

<script>
  const SERVICE = 0xFFE0;
  const CMD_CHAR = 0xFFE2;   // {command, tilt x, tilt y}: 5 start, 6 tilt, 0 back to the clock
  const STATE_CHAR = 0xFFE4; // notification {state, level}
  const TIME_CHAR = 0xFFE5;  // {hour, minute, second}
  const CMD_EXIT = 0, CMD_START = 5, CMD_TILT = 6;
  const FULL_TILT_DEG = 30;  // this much lean gives full acceleration
  const DEAD_ZONE_DEG = 2;
  const SEND_INTERVAL_MS = 50;

  const statusEl = document.getElementById('status');
  const sensorEl = document.getElementById('sensor');
  const connectBtn = document.getElementById('connect');
  const startBtn = document.getElementById('start');
  const exitBtn = document.getElementById('exit');
  const levelEl = document.getElementById('level');
  const stateEl = document.getElementById('gameState');
  const dot = document.getElementById('dot');

  let device = null;
  let cmdChar = null;
  let playing = false;
  let sending = false;
  let wakeLock = null;

  // Raw angles from the phone, the resting angles captured at Start, and keys held on a keyboard
  let raw = { x: 0, y: 0 };
  let rest = { x: 0, y: 0 };
  let haveSensor = false;
  const keys = { x: 0, y: 0 };

  let gattQueue = Promise.resolve();
  function gatt(op) {
    const run = gattQueue.then(op, op);
    gattQueue = run.catch(() => {});
    return run;
  }

  function setStatus(text, bad) {
    statusEl.textContent = text;
    statusEl.classList.toggle('bad', !!bad);
  }

  function showGame(state, level) {
    playing = state === 1;
    stateEl.textContent = playing ? 'Playing' : 'Idle';
    levelEl.textContent = level;
  }

  function showConnected(connected) {
    startBtn.disabled = !connected;
    exitBtn.disabled = !connected;
    connectBtn.textContent = connected ? 'Disconnect' : 'Connect';
    connectBtn.classList.toggle('quiet', connected);
    if (!connected) showGame(0, 0);
  }

  function onDisconnected() {
    cmdChar = null;
    showConnected(false);
    setStatus('Disconnected');
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  // Tilt in -127..127 for each axis, relative to how the phone was held at Start
  function currentTilt() {
    const scale = (deg) => {
      if (Math.abs(deg) < DEAD_ZONE_DEG) return 0;
      return Math.max(-127, Math.min(127, Math.round(deg / FULL_TILT_DEG * 127)));
    };
    if (keys.x || keys.y) return { x: keys.x * 90, y: keys.y * 90 };
    return { x: scale(raw.x - rest.x), y: scale(raw.y - rest.y) };
  }

  window.addEventListener('deviceorientation', (event) => {
    if (event.beta === null || event.gamma === null) return;
    haveSensor = true;
    // beta: top edge raised is positive; gamma: right edge lowered is positive.
    // Rotate the axes when the screen itself is rotated.
    const angle = (screen.orientation && screen.orientation.angle) || 0;
    const b = event.beta, g = event.gamma;
    if (angle === 90) raw = { x: b, y: -g };
    else if (angle === 270) raw = { x: -b, y: g };
    else if (angle === 180) raw = { x: -g, y: -b };
    else raw = { x: g, y: b };
  });

  async function sendTilt() {
    const t = currentTilt();
    dot.style.left = (50 + t.x / 127 * 38) + '%';
    dot.style.top = (50 + t.y / 127 * 38) + '%';
    if (!cmdChar || !playing || sending) return;
    sending = true;
    const target = cmdChar;
    try {
      await gatt(() => target.writeValueWithoutResponse(Int8Array.of(CMD_TILT, t.x, t.y)));
    } catch (err) {
      /* a dropped tilt packet is harmless, the next one follows in 50 ms */
    } finally {
      sending = false;
    }
  }
  setInterval(sendTilt, SEND_INTERVAL_MS);

  async function command(cmd) {
    if (!cmdChar) return;
    const target = cmdChar;
    try {
      await gatt(() => target.writeValueWithResponse(Int8Array.of(cmd, 0, 0)));
    } catch (err) {
      setStatus('Send failed: ' + err.message, true);
    }
  }

  async function start() {
    rest = { x: raw.x, y: raw.y }; // however the phone is held now counts as level
    sensorEl.textContent = haveSensor
      ? 'Tilt the phone to roll the ball'
      : 'No tilt sensor found. Use the arrow keys.';
    try {
      if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    } catch (err) { /* the screen may dim, the game still works */ }
    await command(CMD_START);
  }

  async function connect() {
    if (!navigator.bluetooth) {
      setStatus(window.isSecureContext
        ? 'This browser has no Web Bluetooth. Use Chrome on Android.'
        : 'Web Bluetooth needs HTTPS. Open this page over https://.', true);
      return;
    }
    connectBtn.disabled = true;
    try {
      setStatus('Choose the board in the list…');
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'CH582' }],
        optionalServices: [SERVICE]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);

      setStatus('Connecting…');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE);
      cmdChar = await service.getCharacteristic(CMD_CHAR);
      if (!cmdChar.properties.write) {
        throw new Error('this board is not running the maze firmware');
      }

      const stateChar = await service.getCharacteristic(STATE_CHAR);
      stateChar.addEventListener('characteristicvaluechanged', (event) => {
        const v = event.target.value;
        if (v.byteLength >= 2) showGame(v.getUint8(0), v.getUint8(1));
      });
      await gatt(() => stateChar.startNotifications());

      try {
        const timeChar = await service.getCharacteristic(TIME_CHAR);
        const now = new Date();
        await gatt(() => timeChar.writeValueWithResponse(
          Uint8Array.of(now.getHours(), now.getMinutes(), now.getSeconds())));
      } catch (err) { /* the clock is optional */ }

      showConnected(true);
      setStatus('Connected. Hold the phone comfortably and press Start.');
    } catch (err) {
      if (device && device.gatt.connected) device.gatt.disconnect();
      cmdChar = null;
      showConnected(false);
      setStatus(err.name === 'NotFoundError' ? 'No board chosen' : 'Could not connect: ' + err.message,
        err.name !== 'NotFoundError');
    } finally {
      connectBtn.disabled = false;
    }
  }

  connectBtn.addEventListener('click', () => {
    if (device && device.gatt.connected) device.gatt.disconnect();
    else connect();
  });
  startBtn.addEventListener('click', start);
  exitBtn.addEventListener('click', () => command(CMD_EXIT));

  const KEY_AXIS = { ArrowLeft: ['x', -1], ArrowRight: ['x', 1], ArrowUp: ['y', -1], ArrowDown: ['y', 1] };
  window.addEventListener('keydown', (event) => {
    const k = KEY_AXIS[event.key];
    if (k) { event.preventDefault(); keys[k[0]] = k[1]; }
  });
  window.addEventListener('keyup', (event) => {
    const k = KEY_AXIS[event.key];
    if (k && keys[k[0]] === k[1]) keys[k[0]] = 0;
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  }
</script>
</body>
</html>
