<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10161c">
<title>CH582 LED</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* Layout: one centred column, the lamp button is the whole page; status above, connection below. */
  :root {
    --bg: #eef1f3;
    --panel: #ffffff;
    --fg: #17202a;
    --muted: #5d6b78;
    --line: #cfd6dc;
    --accent: #0b6e8f;
    --on: #f2a900;
    --on-glow: rgba(242, 169, 0, .45);
    --bad: #b3261e;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161c;
      --panel: #19222b;
      --fg: #e6edf2;
      --muted: #93a2b0;
      --line: #2c3945;
      --accent: #5cc3e6;
      --on: #ffc233;
      --on-glow: rgba(255, 194, 51, .4);
      --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.45 var(--sans);
    display: flex;
    justify-content: center;
    padding-inline: 16px;
    padding-block: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  header { text-align: center; display: flex; flex-direction: column; gap: 6px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 650; letter-spacing: -.01em; }
  #status { margin: 0; color: var(--muted); min-height: 1.45em; }
  #status.bad { color: var(--bad); }

  #lamp {
    width: min(62vw, 220px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font: 600 1.6rem var(--sans);
    letter-spacing: .08em;
    cursor: pointer;
    transition: background .15s, box-shadow .15s, color .15s, border-color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  #lamp[aria-pressed="true"] {
    background: var(--on);
    border-color: var(--on);
    color: #1c1500;
    box-shadow: 0 0 0 10px var(--on-glow), 0 0 60px var(--on-glow);
  }
  #lamp:disabled { opacity: .45; cursor: not-allowed; }
  #lamp:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .dim { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .dim-head { display: flex; justify-content: space-between; align-items: baseline; }
  .dim-head label { font-weight: 600; }
  #brightnessValue { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
  #brightness {
    width: 100%;
    height: 32px;
    margin: 0;
    accent-color: var(--on);
    touch-action: pan-y;
  }
  #brightness:disabled { opacity: .45; }
  #brightness:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .btn {
    width: 100%;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--bg);
    font: 600 1rem var(--sans);
    cursor: pointer;
  }
  .btn.quiet { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: progress; }

  dl {
    width: 100%;
    margin: 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 16px;
    font-size: .85rem;
    color: var(--muted);
  }
  dt { white-space: nowrap; }
  dd { margin: 0; text-align: right; font-family: var(--mono); min-width: 0; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { #lamp { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>CH582 LED</h1>
    <p id="status" role="status" aria-live="polite">Not connected</p>
  </header>

  <button id="lamp" type="button" aria-pressed="false" disabled>OFF</button>

  <div class="dim">
    <div class="dim-head">
      <label for="brightness">Brightness</label>
      <span id="brightnessValue">100%</span>
    </div>
    <input id="brightness" type="range" min="0" max="100" step="1" value="100" disabled>
  </div>

  <button id="connect" class="btn" type="button">Connect</button>

  <dl>
    <dt>Device</dt><dd id="devName">none</dd>
    <dt>Board clock</dt><dd id="clockInfo">not set</dd>
  </dl>

  <a href="snake/" style="color: var(--accent); font-size: .9rem">Play Snake</a>
  <a href="maze/" style="color: var(--accent); font-size: .9rem">Play Tilt Maze</a>
  <a href="racing/" style="color: var(--accent); font-size: .9rem">Play Race</a>
  <a href="shooter/" style="color: var(--accent); font-size: .9rem">Play Shooter</a>
</main>

<script>
  const SERVICE = 0xFFE0;
  const LED_CHAR = 0xFFE1;        // 0 = off, 1 = on
  const BRIGHTNESS_CHAR = 0xFFE3; // 0..100 percent
  const TIME_CHAR = 0xFFE5;       // {hour, minute, second}

  const statusEl = document.getElementById('status');
  const lamp = document.getElementById('lamp');
  const connectBtn = document.getElementById('connect');
  const devName = document.getElementById('devName');
  const slider = document.getElementById('brightness');
  const sliderValue = document.getElementById('brightnessValue');
  const clockInfo = document.getElementById('clockInfo');

  let device = null;
  let ledChar = null;
  let brightnessChar = null;
  let busy = false;
  let pendingBrightness = null;
  let sendingBrightness = false;

  // Web Bluetooth allows one GATT operation at a time, so run them one after another.
  let gattQueue = Promise.resolve();
  function gatt(op) {
    const run = gattQueue.then(op, op);
    gattQueue = run.catch(() => {});
    return run;
  }

  function setStatus(text, bad) {
    statusEl.textContent = text;
    statusEl.classList.toggle('bad', !!bad);
  }

  function showLed(on) {
    lamp.setAttribute('aria-pressed', on ? 'true' : 'false');
    lamp.textContent = on ? 'ON' : 'OFF';
  }

  function showBrightness(percent) {
    slider.value = percent;
    sliderValue.textContent = percent + '%';
  }

  function showConnected(connected) {
    lamp.disabled = !connected;
    slider.disabled = !connected || !brightnessChar;
    if (!connected) clockInfo.textContent = 'not set';
    connectBtn.textContent = connected ? 'Disconnect' : 'Connect';
    connectBtn.classList.toggle('quiet', connected);
    devName.textContent = connected && device ? (device.name || 'unnamed') : 'none';
    if (!connected) showLed(false);
  }

  function onDisconnected() {
    ledChar = null;
    brightnessChar = null;
    pendingBrightness = null;
    showConnected(false);
    setStatus('Disconnected');
  }

  async function connect() {
    if (!navigator.bluetooth) {
      setStatus(window.isSecureContext
        ? 'This browser has no Web Bluetooth. Use Chrome on Android.'
        : 'Web Bluetooth needs HTTPS. Open this page over https://.', true);
      return;
    }
    connectBtn.disabled = true;
    try {
      setStatus('Choose the board in the list…');
      device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'CH582' }],
        optionalServices: [SERVICE]
      });
      device.addEventListener('gattserverdisconnected', onDisconnected);

      setStatus('Connecting…');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE);
      ledChar = await service.getCharacteristic(LED_CHAR);

      const value = await gatt(() => ledChar.readValue());
      const raw = value.byteLength ? value.getUint8(0) : 0;
      showLed(raw !== 0 && raw !== 0x30);

      // Brightness and clock need the newer firmware; the on/off button works without them.
      try {
        brightnessChar = await service.getCharacteristic(BRIGHTNESS_CHAR);
        const b = await gatt(() => brightnessChar.readValue());
        showBrightness(Math.min(100, b.byteLength ? b.getUint8(0) : 100));
      } catch (err) {
        brightnessChar = null;
      }
      showConnected(true);
      setStatus('Connected');
      syncClock(service);
    } catch (err) {
      if (device && device.gatt.connected) device.gatt.disconnect();
      ledChar = null;
      brightnessChar = null;
      showConnected(false);
      if (err.name === 'NotFoundError') {
        setStatus('No board chosen');
      } else {
        setStatus('Could not connect: ' + err.message, true);
      }
    } finally {
      connectBtn.disabled = false;
    }
  }

  async function syncClock(service) {
    try {
      const timeChar = await service.getCharacteristic(TIME_CHAR);
      const now = new Date();
      await gatt(() => timeChar.writeValueWithResponse(
        Uint8Array.of(now.getHours(), now.getMinutes(), now.getSeconds())));
      clockInfo.textContent = 'set ' + now.toLocaleTimeString();
    } catch (err) {
      clockInfo.textContent = 'not supported';
    }
  }

  // The slider fires faster than BLE can write, so only the newest value is sent.
  async function sendBrightness() {
    if (sendingBrightness) return;
    sendingBrightness = true;
    try {
      while (pendingBrightness !== null && brightnessChar) {
        const value = pendingBrightness;
        pendingBrightness = null;
        const target = brightnessChar;
        await gatt(() => target.writeValueWithResponse(Uint8Array.of(value)));
      }
      setStatus('Connected');
    } catch (err) {
      setStatus('Write failed: ' + err.message, true);
    } finally {
      sendingBrightness = false;
    }
  }

  async function toggle() {
    if (!ledChar || busy) return;
    busy = true;
    const next = lamp.getAttribute('aria-pressed') !== 'true';
    try {
      const target = ledChar;
      await gatt(() => target.writeValueWithResponse(Uint8Array.of(next ? 1 : 0)));
      showLed(next);
      setStatus('Connected');
    } catch (err) {
      setStatus('Write failed: ' + err.message, true);
    } finally {
      busy = false;
    }
  }

  connectBtn.addEventListener('click', () => {
    if (device && device.gatt.connected) {
      device.gatt.disconnect();
    } else {
      connect();
    }
  });
  lamp.addEventListener('click', toggle);
  slider.addEventListener('input', () => {
    const percent = Number(slider.value);
    sliderValue.textContent = percent + '%';
    pendingBrightness = percent;
    sendBrightness();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
